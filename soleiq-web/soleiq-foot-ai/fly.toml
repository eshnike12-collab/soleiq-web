# Fly.io rather than Render, for two reasons that are specific to this service:
#
#   Persistent disk. src/store/db.py writes SQLite to SOLEIQ_DATA_DIR and the
#   scan artifacts sit beside it. Fly volumes attach to a machine and survive
#   deploys; an ephemeral filesystem would discard every patient's frame bank
#   on each release, which silently defeats the whole bank-pooling design.
#   (Render offers disks too, so on this axis alone it would be a tie.)
#
#   GPU tier. Part 1.3 wants a denser reconstruction, and COLMAP dense MVS and
#   Depth-Anything both want a GPU. Fly has GPU machines (a10/l40s) that this
#   same app can be scaled onto by changing vm.size; Render has no GPU tier, so
#   choosing it now would mean migrating later.
#
# Set secrets out of band, never in this file:
#   fly secrets set SOLEIQ_SUPABASE_URL=... SUPABASE_JWT_SECRET=...

app = "soleiq-foot-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  SOLEIQ_DATA_DIR = "/data"
  SOLEIQ_DB_PATH = "/data/soleiq.db"
  # Explicitly off in the deployed config: it renders raw patient frames.
  SOLEIQ_DEBUG_UI = "0"

[[mounts]]
  source = "foot_ai_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # NOT auto_stop_machines: a cold start reloads the classifier and the depth
  # model, and the patient waiting on a scan pays for it.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [[http_service.checks.http]]
      path = "/health"
      interval = "30s"
      timeout = "5s"
      grace_period = "90s"

[[vm]]
  # Reconstruction is memory-hungry: COLMAP holds the feature database and the
  # point cloud in RAM. 2GB was not enough in local testing.
  size = "performance-2x"
  memory = "4gb"
